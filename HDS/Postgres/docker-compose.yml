name: hds-metadata-postgresql

services:
  hds-metadata-postgresql:
    image: postgres:17

    container_name: docker-hds-metadata-postgresql

    restart: unless-stopped

    environment:
      POSTGRES_DB: sonexus
      POSTGRES_USER: sonexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - ../../storage/postgres:/var/lib/postgresql/data

    networks:
      - docker-network-postgresql

    ports:
      - "5432:5432"

networks:
  docker-network-postgresql:
    external: true
