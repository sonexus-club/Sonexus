name: hds-gateway-express

services:
  hds-gateway-express:
    build: .
    image: sonexus/hds-gateway-express:latest
    container_name: docker-hds-gateway-express

    restart: unless-stopped

    environment:
      SEEDER_INTERNAL_URL: http://docker-hds-webtorrent-seeder:3000
      SEEDER_INTERNAL_TOKEN: ${SEEDER_INTERNAL_TOKEN:?Set SEEDER_INTERNAL_TOKEN}
      PLAYBACK_JWT_PUBLIC_KEY: ${PLAYBACK_JWT_PUBLIC_KEY:?Set PLAYBACK_JWT_PUBLIC_KEY}
      PLAYBACK_JWT_ISSUER: ${PLAYBACK_JWT_ISSUER:?Set PLAYBACK_JWT_ISSUER}
      PLAYBACK_JWT_AUDIENCE: ${PLAYBACK_JWT_AUDIENCE:-sonexus-gateway}
      SEEDER_REQUEST_TIMEOUT_MS: ${SEEDER_REQUEST_TIMEOUT_MS:-5000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      TOKEN_RATE_LIMIT_PER_MINUTE: ${TOKEN_RATE_LIMIT_PER_MINUTE:-10}
      IP_RATE_LIMIT_PER_MINUTE: ${IP_RATE_LIMIT_PER_MINUTE:-120}
      POSTGRES_HOST: docker-hds-metadata-postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sonexus
      POSTGRES_USER: sonexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    networks:
      - docker-network-ipfs
      - docker-network-webtorrent
      - docker-network-postgresql

    ports:
      - "3001:3000"

    volumes:
      - ../Dashboard:/app/dashboard:ro

networks:
  docker-network-ipfs:
    external: true

  docker-network-webtorrent:
    external: true

  docker-network-postgresql:
    external: true
